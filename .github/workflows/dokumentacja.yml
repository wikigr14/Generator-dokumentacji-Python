name: Generuj Dokumentacje

on:
    push:
        branches:
            - test-branch
            - main
    release:
        types: [published] # Uruchamia generowanie przy publikacji nowej wersji (Release)

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Pobranie repozytorium
              uses: actions/checkout@v4

            - name: Konfiguracja Pythona
              uses: actions/setup-python@v5
              with:
                  python-version: 3.x

            - name: Instalacja zależności Pythona
              run: |
                  pip install mkdocs-material mkdocstrings[python]

            - name: Konfiguracja Javy
              uses: actions/setup-java@v3
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Konfiguracja sbt
              uses: sbt/setup-sbt@v1

            - name: Generowanie dokumentacji Scali
              run: sbt doc

            - name: Kopiowanie Scaladoc do folderu MkDocs
              run: |
                  mkdir -p docs/scala-api
                  cp -r target/scala-*/api/* docs/scala-api/

            - name: Budowanie i publikacja całości
              run: mkdocs gh-deploy --force
