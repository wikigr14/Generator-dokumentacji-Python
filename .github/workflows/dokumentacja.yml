name: Generuj Dokumentacje

on:
    push:
        branches:
            - main
            - develop
    release:
        types: [published]
    pull_request:
        branches:
            - develop

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Pobranie repozytorium
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Instalacja Graphviz
              # Wymagany przez pyreverse -o png (diagramy Python)
              # oraz sbt doc -diagrams (Scaladoc z grafami dziedziczenia w HTML)
              run: sudo apt-get install -y graphviz

            - name: Konfiguracja Pythona
              uses: actions/setup-python@v5
              with:
                  python-version: 3.x

            - name: Instalacja zależności Pythona
              run: pip install -r requirements.txt

            - name: Konfiguracja Javy
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Konfiguracja sbt
              uses: sbt/setup-sbt@v1

            - name: Generowanie Scaladoc (z grafami dziedziczenia w HTML)
              run: sbt doc

            - name: Kopiowanie Scaladoc do folderu MkDocs
              run: |
                  mkdir -p docs/scaladoc
                  cp -r target/scala-*/api/* docs/scaladoc/ || echo "Nie znaleziono plików Scaladoc, pomijam"

            - name: Generowanie diagramów PNG dla modułów Python
              # Skanuje src/python/, generuje PNG przez pyreverse
              # i aktualizuje sekcję nav w mkdocs.yml
              run: python scripts/generate_diagrams.py

            - name: Konfiguracja Git dla Mike
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Budowanie i publikacja wersji (mike)
              run: |
                  if [ "${{ github.event_name }}" = "release" ]; then
                    VERSION_NAME="${{ github.event.release.tag_name }}"
                    mike deploy --push --update-aliases $VERSION_NAME latest
                    mike set-default --push latest
                  else
                    mike deploy --push dev
                  fi
