site_name: Firmowa Dokumentacja (Projekt 18)
site_description: Ustandaryzowana i wersjonowana dokumentacja dla projektów Python i Scala.
site_url: https://wikigr14.github.io/Generator-dokumentacji-Python/
theme:
    name: material
    icon:
        logo: material/library
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: deep purple
          accent: deep purple
          toggle:
              icon: material/weather-night
              name: Przełącz na tryb ciemny
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: deep purple
          accent: deep purple
          toggle:
              icon: material/weather-sunny
              name: Przełącz na tryb jasny
    features:
        - navigation.tabs
        - navigation.top
        - navigation.instant
        - content.code.copy
        - navigation.sections
        - navigation.expand

extra:
    version:
        provider: mike

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  paths: [src]

nav:
    - Strona Główna: index.md
    - Moduł Pythona:
        - Omówienie: calculator.md
    - Moduł Scali (API):
        - Omówienie: scala.md