site_name: Dokumentacja Projektu 18
site_description: Automatycznie generowana dokumentacja dla Pythona i Scali.
theme:
    name: material
    palette:
        primary: blue
plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  paths: [src]
nav:
    - Strona Główna: index.md
    - Moduł Pythona (Kalkulator): calculator.md
    - Moduł Scali (API): scala.md
